name: prs
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # System tools
  - python=3.10
  - pip=23.0.1
  - wget=1.25.0
  - curl=8.12.1
  - unzip
  - parallel=4.5.2
  - datamash=1.0.6
  - zstd=1.5.6
  - htslib=1.3.1        # bgzip, tabix
  - plink2
  - csvtk=0.25.0
  # R and all packages via conda-forge (pre-built, no compilation)
  - r-base=4.3.1
  - r-data.table=1.14.8
  - r-matrix=1.6_3
  - r-proc=1.18.5
  - r-dplyr=1.1.4
  - r-tidyr=1.3.0
  - r-readr=2.1.4
  - r-purrr=1.0.2
  - r-tibble=3.2.1
  - r-stringr=1.5.1
  - r-magrittr=2.0.3
  - r-r.utils=4.5.2
  - r-foreach=1.5.2
  - r-doparallel=1.0.17
  - r-optparse=1.8.2
  - r-docopt=0.7.2
  - r-rio=1.3.0
  - r-mass=7.3_60
  - r-pacman=0.5.1
  - r-bigsnpr=1.12.21
  - r-biocmanager=1.30.27
  # Python packages
  - pip:
    - pandas=2.2.2
    - numpy=1.26.0
    - scipy=1.13.1
